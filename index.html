<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Surprise For You</title>
  
  <!-- Google Fonts: Handwritten font (Caveat) + Sans-serif (Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       COLOR PALETTE & GLOBAL STYLES
       Chelsea Blue: #001489
       Yellow Accent: #FFD100
       Soft White: #F8F9FA
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #001489; /* Chelsea Royal Blue */
      font-family: 'Caveat', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .title {
      color: #FFD100; /* Yellow */
      font-size: 3rem;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* ==========================================
       ENVELOPE STYLES
       ========================================== */
    .envelope-container {
      position: relative;
      width: 280px;
      height: 180px;
      background-color: #1a2f9b;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }

    .envelope-container:hover {
      transform: translateY(-5px);
    }

    /* Front pocket of envelope */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid #ffffff;
      border-right: 140px solid #ffffff;
      border-top: 90px solid transparent;
      border-bottom: 90px solid #f0f0f0;
      border-radius: 0 0 8px 8px;
      z-index: 3;
    }

    /* Top Flap of envelope */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid #FFD100; /* Yellow Flap */
      transform-origin: top;
      transition: transform 0.5s ease 0.1s, z-index 0.2s ease 0.3s;
      z-index: 4;
    }

    .tap-hint {
      margin-top: 25px;
      color: #ffffff;
      font-size: 1.8rem;
    }

    /* ==========================================
       PASSCODE CARD
       ========================================== */
    .card {
      position: absolute;
      top: 10px;
      left: 15px;
      width: 250px;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 22px 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      z-index: 2;
      opacity: 0;
      transform: translateY(0);
      transition: transform 0.6s ease-in-out, opacity 0.4s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .card h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #001489;
      margin-bottom: 4px;
    }

    .card .subtitle {
      font-size: 0.85rem;
      color: #555555;
      margin-bottom: 8px;
    }

    /* Tiny clue text styled in handwriting font */
    .clue-text {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: #001489;
      font-weight: bold;
      background-color: #fff9d6;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .passcode-input {
      width: 100%;
      padding: 10px;
      border: 2px solid #001489;
      border-radius: 6px;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 3px;
      margin-bottom: 12px;
      outline: none;
    }

    .passcode-input:focus {
      border-color: #FFD100;
    }

    .btn-unlock {
      width: 100%;
      background-color: #FFD100;
      color: #001489;
      border: none;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-unlock:hover {
      background-color: #e6bd00;
    }

    .error-msg {
      color: #d9534f;
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }

    /* ==========================================
       OPENED STATE ANIMATION CLASSES
       ========================================== */
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-container.open .card {
      opacity: 1;
      transform: translateY(-165px);
      z-index: 10;
    }

    .envelope-container.open + .tap-hint {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1 class="title">You've Got Mail! 💙</h1>

    <!-- Interactive Envelope -->
    <div class="envelope-container" id="envelope" onclick="openEnvelope()">
      <div class="envelope-flap"></div>
      <div class="envelope-pocket"></div>
      
      <!-- Hidden Passcode Card -->
      <div class="card" onclick="event.stopPropagation();">
        <h2>Enter Passcode</h2>
        <p class="subtitle">Enter the secret key to open:</p>
        
        <!-- Tiny Clue -->
        <div class="clue-text">Hint: Today's Date 🎂</div>

        <input 
          type="password" 
          id="passcode" 
          class="passcode-input" 
          placeholder="DDMMYY" 
          maxlength="6"
        />
        <button class="btn-unlock" onclick="checkPasscode()">Unlock</button>
        <p id="error" class="error-msg">Incorrect passcode! Try again 😉</p>
      </div>
    </div>

    <p class="tap-hint">Tap envelope to open</p>
  </div>

  <script>
    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      envelope.classList.add('open');
    }

    function checkPasscode() {
      const input = document.getElementById('passcode').value;
      const errorMsg = document.getElementById('error');
      
      // Passcode set to 190900 (Format: DDMMYY)
      const correctPasscode = "190900"; 

      if (input === correctPasscode) {
        window.location.href = "stage1.html"; 
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>

</body>
</html>
